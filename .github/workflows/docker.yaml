name: Update DockerImage

on:
  workflow_run:
    workflows:
      - Build project
    types:
      - completed

jobs:
  job_docker:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artefact
        uses: actions/download-artifact@v4
        with:
          name: restream-manager-build
          path: dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }} .

      - name: Save Docker image
        run: docker save ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }} -o docker-image.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: restream-manager-docker-image
          path: docker-image.tar

  job_pushimage:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    needs: job_docker
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: restream-manager-docker-image
          path: .

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load Docker image
        run: docker load -i docker-image.tar

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}
