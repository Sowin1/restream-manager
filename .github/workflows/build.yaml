name: Build project

on:
  workflow_run:
    workflows:
      - Verify version
    types:
      - completed

jobs:
  job_build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dist
        run: npm run build

      - name: Save build
        uses: actions/upload-artifact@v4
        with:
          name: restream-manager-build
          path: dist/
      
